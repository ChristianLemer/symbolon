name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        # Pinned to v8.1.0 commit SHA. Major/minor floating tags were deprecated
        # in setup-uv v8 to mitigate supply-chain attacks; bump deliberately.
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        # --frozen ensures CI installs from the committed lockfile rather
        # than silently updating it if stale.
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q
